name: Deploy Docs

on:
  push:
    branches: [main]
  # Poll for a new DegenView release (see the `check` job). A release in another repository
  # cannot start this workflow without a token that can write here, so this repository looks.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://docs.degenview.app
  APP_REPO: degenview/degenview

jobs:
  # Decide whether to deploy. A push or a manual run always deploys. A scheduled run deploys only
  # when the newest DegenView release (release candidates included) differs from the one the live
  # site was last built for, which the site publishes at /release.txt. No state is stored anywhere
  # else, so a failed deploy simply retries on the next poll.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Compare the latest release with the live site
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${APP_REPO}/releases?per_page=1" --jq '.[0].tag_name // ""')
          if [ -n "$latest" ] && ! printf '%s' "$latest" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Unexpected release tag: ${latest}"
            exit 1
          fi
          echo "release=${latest}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o live.txt -w '%{http_code}' "${SITE_URL}/release.txt" || echo 000)
          case "$code" in
            200) live=$(tr -d '[:space:]' < live.txt) ;;
            404) live="" ;;
            *) echo "::error::Could not read ${SITE_URL}/release.txt (HTTP ${code})"; exit 1 ;;
          esac
          echo "latest release: ${latest:-none}; live site built for: ${live:-nothing recorded}"
          if [ -n "$latest" ] && [ "$latest" != "$live" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run docs:build

      - name: Record the release this build is for
        env:
          RELEASE: ${{ needs.check.outputs.release }}
        run: printf '%s\n' "$RELEASE" > docs/.vitepress/dist/release.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
